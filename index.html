<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Skin Viewer 3D</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">

    <!-- Die Bibliothek, die aus 2D-Bildern 3D-Modelle macht -->
    <script src="https://unpkg.com/skinview3d@3.0.0/bundles/skinview3d.bundle.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b); 
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #f8fafc;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 700;
        }

        /* Der Container für das 3D-Modell */
        #skin_container {
            width: 250px;
            height: 350px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* --- BUTTONS & INPUTS --- */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        /* Versteckt den hässlichen Standard-Datei-Upload */
        input[type="file"] {
            display: none;
        }

        /* Label fungiert als cooler Button für den Upload */
        .custom-file-upload {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }

        .custom-file-upload:hover {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn-download:hover {
            background: linear-gradient(135deg, #34d399, #10b981);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4);
        }

        .btn-download:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Skin Viewer 🎮</h1>
        
        <!-- Hier rendert skinview3d das Modell rein -->
        <div id="skin_container"></div>

        <div class="btn-group">
            <!-- Upload Button -->
            <label class="custom-file-upload">
                <input type="file" id="skin_upload" accept=".png">
                📁 Skin auswählen (PNG)
            </label>

            <!-- Download Button (standardmäßig deaktiviert, bis man was hochlädt) -->
            <button class="btn-download" id="download_btn" onclick="downloadSkin()" disabled>
                📥 Skin herunterladen
            </button>
        </div>
    </div>

    <script>
        // 1. Variablen vorbereiten
        let currentSkinURL = null;
        let currentFileName = "minecraft_skin.png"; // Standardname

        // 2. Den 3D-Viewer initialisieren
        const viewer = new skinview3d.SkinViewer({
            container: document.getElementById("skin_container"),
            width: 250,
            height: 350
        });

        // Ein bisschen Animation: Die Figur soll automatisch laufen und sich drehen
        viewer.animations.add(skinview3d.WalkingAnimation);
        viewer.animations.add(skinview3d.RotatingAnimation);

        // 3. Wenn eine Datei ausgewählt wird...
        document.getElementById('skin_upload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            
            if (file) {
                // Den Original-Dateinamen speichern
                currentFileName = file.name;

                // Falls es schon eine URL gab, diese löschen (Speicher freimachen)
                if (currentSkinURL) {
                    URL.revokeObjectURL(currentSkinURL);
                }

                // Eine temporäre URL aus der hochgeladenen 2D-Datei erstellen
                currentSkinURL = URL.createObjectURL(file);

                // Den 3D-Viewer anweisen, dieses Bild als Textur zu laden
                viewer.loadSkin(currentSkinURL);

                // Den Download-Button aktivieren
                document.getElementById('download_btn').disabled = false;
            }
        });

        // 4. Die Download-Funktion (Minecraft.net kompatibel)
        function downloadSkin() {
            if (!currentSkinURL) return;

            // Wir erstellen einen unsichtbaren Link, geben ihm die 2D-Originaldatei
            // und tun per JavaScript so, als würde jemand darauf klicken.
            const a = document.createElement("a");
            a.href = currentSkinURL;
            a.download = currentFileName; // Nutzt den gleichen Namen wie beim Upload
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>

</body>
</html>
