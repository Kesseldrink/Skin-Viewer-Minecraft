<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 3D Skin Viewer</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧍</text></svg>">

    <script src="https://cdn.jsdelivr.net/npm/skinview3d@3.0.0/bundles/skinview3d.bundle.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b); 
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #f8fafc;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 700;
        }

        /* --- 1. SUCHFELD (Ganz oben) --- */
        .input-group {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
        }

        .input-group button {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 0 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .input-group button:hover {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            transform: translateY(-2px);
        }

        /* --- 2. 3D FIGUR BEREICH (In der Mitte) --- */
        .skin-display {
            display: none; /* Wird erst sichtbar, wenn gesucht wird */
            background-color: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 25px;
            width: 100%;
            box-sizing: border-box;
        }

        #player-name-display {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #3b82f6;
        }

        #skin-canvas {
            cursor: grab;
            outline: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            display: block;
            margin: 0 auto;
        }

        #skin-canvas:active {
            cursor: grabbing;
        }

        /* --- 3. DOWNLOAD BUTTON (Ganz unten) --- */
        .btn-download {
            display: none; /* Wird auch erst nach der Suche eingeblendet */
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn-download:hover {
            background: linear-gradient(135deg, #34d399, #10b981);
            transform: translateY(-2px);
        }

        /* Fehler-Meldung */
        #error-message {
            color: #ed4245;
            display: none;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Skin Viewer 3D 🗡️</h1>

        <div class="input-group">
            <input type="text" id="mc-player-query" placeholder="Minecraft Name..." autocomplete="new-password" data-lpignore="true" onkeydown="if(event.key === 'Enter') fetchSkin()">
            <button onclick="fetchSkin()">Suchen</button>
        </div>

        <div id="error-message">Spieler wurde nicht gefunden!</div>

        <div id="skin-display" class="skin-display">
            <div id="player-name-display">Name</div>
            <div class="images-container">
                <canvas id="skin-canvas"></canvas>
            </div>
        </div>

        <button id="download_btn" class="btn-download" onclick="downloadSkin()">
            📥 Skin herunterladen
        </button>
    </div>

    <script>
        let skinViewer;
        let currentUsername = "";

        function fetchSkin() {
            const username = document.getElementById('mc-player-query').value.trim();
            if (username === "") return;

            currentUsername = username;

            const skinDisplay = document.getElementById('skin-display');
            const errorMessage = document.getElementById('error-message');
            const nameDisplay = document.getElementById('player-name-display');
            const downloadBtn = document.getElementById('download_btn');

            errorMessage.style.display = 'none';
            nameDisplay.innerText = username;

            // Die funktionierende Minotar URL für den Skin
            const skinUrl = `https://minotar.net/skin/${username}`;

            // Sichtbarkeit einschalten
            skinDisplay.style.display = 'block';
            downloadBtn.style.display = 'block';

            if (!skinViewer) {
                // Wenn der Viewer noch nicht existiert, neu bauen
                skinViewer = new skinview3d.SkinViewer({
                    canvas: document.getElementById("skin-canvas"),
                    width: 250,
                    height: 350,
                    skin: skinUrl
                });

                // Maus-Steuerung aktivieren
                const control = skinview3d.createOrbitControls(skinViewer);
                control.enableRotate = true;
                control.enableZoom = true; 
                control.enablePan = false;

                // Geh-Animation starten
                skinViewer.animation = new skinview3d.WalkingAnimation();
                skinViewer.animation.speed = 0.5;

            } else {
                // Wenn er existiert, nur die Textur neu laden
                skinViewer.loadSkin(skinUrl).catch(e => {
                    skinDisplay.style.display = 'none';
                    downloadBtn.style.display = 'none';
                    errorMessage.style.display = 'block';
                });
            }
        }

        // Die downloadSkin-Funktion nutzt den Minotar Direct-Download
        function downloadSkin() {
            if (!currentUsername) return;

            const downloadUrl = `https://minotar.net/download/${currentUsername}`;

            const a = document.createElement("a");
            a.href = downloadUrl;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>

</body>
</html>
