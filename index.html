<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Skin Suchmaschine</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">

    <!-- skinview3d Bibliothek -->
    <script src="https://unpkg.com/skinview3d@3.0.0/bundles/skinview3d.bundle.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b); 
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #f8fafc;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 700;
        }

        #skin_container {
            width: 250px;
            height: 350px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- SUCHFELD & BUTTONS --- */
        .search-box {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
        }

        .btn-search {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 0 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-search:hover {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            transform: translateY(-2px);
        }

        .btn-download {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn-download:hover {
            background: linear-gradient(135deg, #34d399, #10b981);
            transform: translateY(-2px);
        }

        .btn-download:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Skin Suche 🔍</h1>
        
        <div id="skin_container">
            <span id="loading_text" style="color: #64748b; font-weight: bold; display: none;">Lädt Skin...</span>
        </div>

        <div class="search-box">
            <!-- Namen eingeben. Enter-Taste löst die Suche auch aus. -->
            <input type="text" id="username_input" placeholder="z.B. Thies" onkeydown="if(event.key === 'Enter') searchSkin()">
            <button class="btn-search" onclick="searchSkin()">Suchen</button>
        </div>

        <button class="btn-download" id="download_btn" onclick="downloadSkin()" disabled>
            📥 Skin herunterladen
        </button>
    </div>

    <script>
        let currentSkinURL = null;
        let currentUsername = "";

        // 3D-Viewer Setup
        const viewer = new skinview3d.SkinViewer({
            container: document.getElementById("skin_container"),
            width: 250,
            height: 350
        });

        viewer.animations.add(skinview3d.WalkingAnimation);
        viewer.animations.add(skinview3d.RotatingAnimation);

        // Suchfunktion über die API
        async function searchSkin() {
            const username = document.getElementById("username_input").value.trim();
            if (!username) return;

            document.getElementById("loading_text").style.display = "block";
            currentUsername = username;

            // Wir nutzen mc-heads.net, um die direkte Skin-Datei abzugreifen
            const apiUrl = `https://mc-heads.net/skin/${username}`;

            try {
                // Wir laden das Bild als "Blob" (Rohdaten) herunter, um es lokal verarbeiten zu können
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error("Fehler beim Laden");
                }

                const blob = await response.blob();
                
                // Alten Skin aus dem Speicher werfen
                if (currentSkinURL) {
                    URL.revokeObjectURL(currentSkinURL);
                }

                // Neue URL für das 3D-Modell generieren
                currentSkinURL = URL.createObjectURL(blob);

                // In den Viewer laden
                viewer.loadSkin(currentSkinURL);

                // Download freischalten
                document.getElementById('download_btn').disabled = false;
                document.getElementById("loading_text").style.display = "none";

            } catch (error) {
                document.getElementById("loading_text").style.display = "none";
                alert(`Der Skin für "${username}" konnte nicht gefunden werden. Hast du dich vertippt?`);
            }
        }

        // Die fertige Minecraft.net Datei herunterladen
        function downloadSkin() {
            if (!currentSkinURL) return;

            const a = document.createElement("a");
            a.href = currentSkinURL;
            // Die Datei wird nach dem Spieler benannt (z.B. "Thies_skin.png")
            a.download = `${currentUsername}_skin.png`; 
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>

</body>
</html>
