<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 3D Skin Viewer</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧍</text></svg>">

    <!-- Hier importieren wir die 3D-Bibliothek "skinview3d" -->
    <script src="https://cdn.jsdelivr.net/npm/skinview3d@3.0.0/bundles/skinview3d.bundle.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c2f33;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            background-color: #23272a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 500px;
            border: 1px solid #444;
        }

        h1 {
            color: #7289da;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #7289da;
            background-color: #2c2f33;
            color: white;
            font-size: 18px;
            outline: none;
        }

        button {
            background-color: #5865f2;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #4752c4;
            transform: translateY(-2px);
        }

        .skin-display {
            display: none; 
            background-color: #2c2f33;
            padding: 20px;
            border-radius: 12px;
            border: 1px dashed #7289da;
        }

        .images-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
            flex-wrap: wrap; /* Bricht um, wenn der Bildschirm zu schmal wird */
        }

        .head-img {
            width: 100px;
            border-radius: 8px;
            image-rendering: pixelated; 
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
            margin-bottom: 20px;
        }

        /* Styling für unsere 3D Zeichenfläche (Canvas) */
        #skin-canvas {
            cursor: grab;
            outline: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        #skin-canvas:active {
            cursor: grabbing;
        }

        #player-name-display {
            font-size: 24px;
            font-weight: bold;
            color: #57f287;
            margin-bottom: 10px;
        }

        #error-message {
            color: #ed4245;
            display: none;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Skin Viewer 3D 🗡️</h1>
        
        <div class="input-group">
            <!-- 
                Änderungen gegen Bitwarden: 
                - ID geändert
                - autocomplete="new-password" und data-lpignore="true" hinzugefügt 
            -->
            <input type="text" id="mc-player-query" placeholder="Minecraft Name..." autocomplete="new-password" data-lpignore="true" onkeydown="if(event.key === 'Enter') fetchSkin()">
            <button onclick="fetchSkin()">Suchen</button>
        </div>

        <div id="error-message">Spieler nicht gefunden oder Fehler!</div>

        <div class="skin-display" id="skin-display">
            <div id="player-name-display">Name</div>
            
            <div class="images-container">
                <img id="head-image" class="head-img" src="" alt="Kopf">
                
                <!-- Hier zeichnet das JavaScript gleich das drehbare 3D-Modell rein -->
                <canvas id="skin-canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Eine Variable, um unseren 3D-Viewer zu speichern
        let skinViewer;

        function fetchSkin() {
            const username = document.getElementById('mc-player-query').value.trim();
            if (username === "") return;

            const skinDisplay = document.getElementById('skin-display');
            const errorMessage = document.getElementById('error-message');
            const headImage = document.getElementById('head-image');
            const nameDisplay = document.getElementById('player-name-display');

            errorMessage.style.display = 'none';
            nameDisplay.innerText = username;

            // Die URL für die reine Skin-Datei (texture)
            const skinUrl = `https://minotar.net/skin/${username}`;
            // Die URL für den statischen Kopf
            const headUrl = `https://mc-heads.net/avatar/${username}/100`;

            headImage.src = headUrl;
            skinDisplay.style.display = 'block';

            // Wenn der Viewer noch nicht existiert, bauen wir ihn neu auf
            if (!skinViewer) {
                skinViewer = new skinview3d.SkinViewer({
                    canvas: document.getElementById("skin-canvas"),
                    width: 250,
                    height: 350,
                    skin: skinUrl
                });

                // Steuerung aktivieren (Drehen mit der Maus)
                const control = skinview3d.createOrbitControls(skinViewer);
                control.enableRotate = true;
                control.enableZoom = true; // Erlaubt das Scrollen zum Zoomen
                control.enablePan = false;

                // Kleine Geh-Animation hinzufügen
                skinViewer.animation = new skinview3d.WalkingAnimation();
                skinViewer.animation.speed = 0.5;

            } else {
                // Wenn der Viewer schon läuft, tauschen wir nur den Skin aus
                skinViewer.loadSkin(skinUrl).catch(e => {
                    skinDisplay.style.display = 'none';
                    errorMessage.style.display = 'block';
                });
            }
        }
    </script>

</body>
</html>
