<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Skin Viewer</title>
    
    <!-- Das Icon (Favicon) für den Browser-Tab -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧍</text></svg>">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c2f33;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            background-color: #23272a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 500px;
            border: 1px solid #444;
        }

        h1 {
            color: #7289da;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #7289da;
            background-color: #2c2f33;
            color: white;
            font-size: 18px;
            outline: none;
        }

        button {
            background-color: #5865f2;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #4752c4;
            transform: translateY(-2px);
        }

        /* Bereich für die angezeigten Bilder */
        .skin-display {
            display: none; /* Ist am Anfang unsichtbar */
            background-color: #2c2f33;
            padding: 20px;
            border-radius: 12px;
            border: 1px dashed #7289da;
        }

        .images-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
        }

        img {
            /* WICHTIG: Macht, dass Minecraft-Skins scharf und pixelig bleiben und nicht verschwimmen! */
            image-rendering: pixelated; 
            max-width: 100%;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
        }

        .head-img {
            width: 100px;
            border-radius: 8px;
        }

        .body-img {
            height: 250px;
        }

        #player-name-display {
            font-size: 24px;
            font-weight: bold;
            color: #57f287;
            margin-bottom: 10px;
        }

        /* Ein kleiner Fehler-Text, falls der Spieler nicht existiert */
        #error-message {
            color: #ed4245;
            display: none;
            margin-top: 20px;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Skin Viewer 🗡️</h1>
        
        <div class="input-group">
            <!-- onkeydown sorgt dafür, dass man auch mit der Enter-Taste suchen kann -->
            <input type="text" id="username" placeholder="Minecraft Name..." onkeydown="if(event.key === 'Enter') fetchSkin()">
            <button onclick="fetchSkin()">Suchen</button>
        </div>

        <div id="error-message">Spieler nicht gefunden oder Fehler!</div>

        <div class="skin-display" id="skin-display">
            <div id="player-name-display">Name</div>
            
            <div class="images-container">
                <!-- Hier laden wir den 3D Kopf rein -->
                <img id="head-image" class="head-img" src="" alt="Kopf">
                
                <!-- Hier laden wir den 3D Körper rein -->
                <img id="body-image" class="body-img" src="" alt="Körper">
            </div>
        </div>
    </div>

    <script>
        function fetchSkin() {
            // Holt sich den Namen aus dem Eingabefeld und entfernt Leerzeichen
            const username = document.getElementById('username').value.trim();
            
            // Wenn nichts eingegeben wurde, mach nichts
            if (username === "") return;

            // Die HTML-Elemente holen
            const skinDisplay = document.getElementById('skin-display');
            const errorMessage = document.getElementById('error-message');
            const headImage = document.getElementById('head-image');
            const bodyImage = document.getElementById('body-image');
            const nameDisplay = document.getElementById('player-name-display');

            // Fehlermeldung ausblenden, falls sie noch an war
            errorMessage.style.display = 'none';
            
            // Den Namen im Display aktualisieren
            nameDisplay.innerText = username;

            // --- DAS IST DIE API-MAGIE ---
            // Wir bauen die URL zusammen, die uns die Bilder gibt
            const headUrl = `https://mc-heads.net/avatar/${username}/100`;
            const bodyUrl = `https://mc-heads.net/body/${username}`;

            // Wir tauschen die Quelle (src) der Bilder auf unserer Seite aus
            headImage.src = headUrl;
            bodyImage.src = bodyUrl;

            // Wenn das Bild erfolgreich geladen wird, zeigen wir den Bereich an
            bodyImage.onload = function() {
                skinDisplay.style.display = 'block';
            };

            // Wenn das Bild NICHT geladen werden kann (z.B. falscher Name)
            bodyImage.onerror = function() {
                skinDisplay.style.display = 'none';
                errorMessage.style.display = 'block';
            };
        }
    </script>

</body>
</html>
